<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Morfi en vivo</title>
  <meta name="description" content="Morfi, la mascota de Morphiq, animado en 3D: saluda, habla, te mira y reacciona." />
  <link rel="stylesheet" href="./src/live/live.css" />
</head>
<body>
  <div id="app" class="bg-light">
    <canvas id="view" aria-label="Morfi en 3D"></canvas>
    <div id="status" role="status">Cargando a Morfi… <span id="progress">0%</span></div>

    <button id="panel-toggle" class="panel-toggle" aria-expanded="true" aria-controls="panel">Controles</button>
    <aside id="panel" class="panel">
      <header>
        <h1>Morfi <span>en vivo</span></h1>
        <p class="ver" id="build-info"></p>
      </header>

      <section>
        <h2>Animaciones</h2>
        <div class="grid" id="actions"></div>
      </section>

      <section>
        <h2>Que diga algo</h2>
        <form id="say-form" class="say">
          <input id="say-text" type="text" maxlength="240" value="¡Hola! Soy Morfi, ¿en qué te ayudo hoy?" aria-label="Texto que dirá Morfi" />
          <button type="submit">Decir</button>
        </form>
      </section>

      <section>
        <h2>Comportamiento</h2>
        <label class="check"><input type="checkbox" id="follow" checked /> Me sigue con la mirada</label>
        <label class="check"><input type="checkbox" id="kiosk" /> Modo pantalla (se mueve solo)</label>
        <div class="row" id="bgs">
          <button data-bg="light" class="on">Fondo claro</button>
          <button data-bg="dark">Fondo oscuro</button>
        </div>
      </section>

      <footer>
        <a href="./index.html">Visor técnico del modelo anterior</a>
        <span id="stats"></span>
      </footer>
    </aside>
  </div>
  <script type="module" src="./src/live/main.ts"></script>
</body>
</html>
